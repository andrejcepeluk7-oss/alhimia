<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алхимия реагентов</title>
<style>
    body { font-family: "Comic Sans MS", cursive; background: #1a1b1e; color: #e8eaed; margin: 0; padding: 12px; }
    .container { max-width: 500px; margin: auto; display: flex; flex-direction: column; gap: 14px; }
    
    select { padding: 14px; border-radius: 14px; border: none; background: #303134; color: white; font-size: 18px; outline: none; width: 100%; cursor: pointer; border: 1px solid #3c4043; }
    
    /* Основное поле результата: по умолчанию текст белый */
    .result { padding: 20px; border-radius: 14px; background: #2d2f33; min-height: 60px; font-size: 22px; text-align: center; border: 2px dashed #4a4d52; color: #e8eaed; display: flex; align-items: center; justify-content: center; }
    
    .btn-row { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border-radius: 12px; border: none; background: #3a3d42; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; }
    button:hover { background: #4a4d52; }
    
    .discovered { padding: 15px; border-radius: 14px; background: #2d2f33; margin-top: 10px; border: 1px solid #3c4043; }
    h3 { margin-top: 0; border-bottom: 1px solid #4a4d52; padding-bottom: 5px; }
    /* Убрал синий цвет из названий в списке */
    #list b { color: #e8eaed; display: block; margin-top: 10px; }
    #list span { color: #9aa0a6; font-size: 0.85em; display: block; padding-left: 10px; border-left: 2px solid #3c4043; }
</style>
</head>
<body>

<div class="container">
    <select id="s1"></select>
    <select id="s2"></select>
    <select id="s3"></select>

    <div class="result" id="result">Выберите реагенты</div>

    <div class="btn-row">
        <button onclick="save()">Сохранить рецепт</button>
        <button onclick="clearAll()">Очистить все</button>
    </div>

    <div class="discovered">
        <h3>Книга открытых формул:</h3>
        <div id="list">Пока здесь пусто</div>
    </div>
</div>

<script>
const teaHerbs = ["Боярышник","Календула","Крапива","Лаванда","Липа","Мать-и-мачеха","Мелисса","Мята перечная","Одуванчик","Подорожник","Ромашка","Рябина","Тысячелистник","Хвощ полевой","Череда","Черника","Шалфей","Эхинацея","Имбирь","Росток дерева"];
const teaBasics = ["Ромашка", "Мята перечная", "Липа"];

const reagents = ["Боярышник","Календула","Крапива","Лаванда","Липа","Мать-и-мачеха","Мелисса","Мята перечная","Одуванчик","Подорожник","Ромашка","Рябина","Тысячелистник","Хвощ полевой","Череда","Черника","Шалфей","Эхинацея","Имбирь","Кости","Росток дерева","Органы монстров","Обычные водоросли","Пыльца фей","Антимагические кристаллы","Щупальца","Монеты медные","Паутина"].sort((a,b)=>a.localeCompare(b,'ru'));

function fill(sel){
    sel.innerHTML = `<option value="">Выберите реагент</option>`;
    reagents.forEach(r=>{ let o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
}
[s1, s2, s3].forEach(fill);

function key(arr){ return [...arr].sort((a,b)=>a.localeCompare(b,'ru')).join('|'); }

// Вставлена полная база рецептов из предыдущих итераций
const recipesRaw = {
    "Зелье восстановления": [["Подорожник","Календула","Кости"], ["Ромашка","Росток дерева","Календула"], ["Череда","Подорожник","Органы монстров"], ["Календула","Ромашка","Обычные водоросли"], ["Подорожник","Череда","Пыльца фей"], ["Шалфей","Подорожник","Календула"], ["Крапива","Ромашка","Липа"], ["Подорожник","Эхинацея","Черника"], ["Боярышник","Подорожник","Мать-и-мачеха"], ["Кости","Календула","Липа"]],
    "Зелье концентрации": [["Мелисса","Пыльца фей","Лаванда"], ["Мята перечная","Антимагические кристаллы","Ромашка"], ["Шалфей","Пыльца фей","Мелисса"], ["Лаванда","Ромашка","Антимагические кристаллы"], ["Мята перечная","Шалфей","Пыльца фей"], ["Мелисса","Мята перечная","Антимагические кристаллы"], ["Черника","Пыльца фей","Шалфей"], ["Лаванда","Липа","Мелисса"], ["Росток дерева","Антимагические кристаллы","Шалфей"], ["Черника","Лаванда","Мята перечная"]],
    "Зелье силы": [["Крапива","Щупальца","Имбирь"], ["Эхинацея","Кости","Органы монстров"], ["Крапива","Монеты медные","Хвощ полевой"], ["Имбирь","Щупальца","Пыльца фей"], ["Крапива","Органы монстров","Обычные водоросли"], ["Эхинацея","Щупальца","Кости"], ["Имбирь","Хвощ полевой","Органы монстров"], ["Крапива","Имбирь","Кости"], ["Щупальца","Монеты медные","Эхинацея"], ["Хвощ полевой","Имбирь","Органы монстров"]],
    "Зелье жизненной энергии": [["Боярышник","Рябина","Росток дерева"], ["Липа","Пыльца фей","Ромашка"], ["Боярышник","Обычные водоросли","Календула"], ["Рябина","Лаванда","Мелисса"], ["Липа","Росток дерева","Пыльца фей"], ["Боярышник","Липа","Шалфей"], ["Эхинацея","Боярышник","Ромашка"], ["Росток дерева","Мелисса","Одуванчик"], ["Рябина","Эхинацея","Липа"], ["Боярышник","Пыльца фей","Ромашка"]],
    "Зелье выносливости": [["Мать-и-мачеха","Щупальца","Тысячелистник"], ["Шалфей","Обычные водоросли","Лаванда"], ["Мята перечная","Кости","Ромашка"], ["Тысячелистник","Крапива","Пыльца фей"], ["Мать-и-мачеха","Ромашка","Одуванчик"], ["Хвощ полевой","Мята перечная","Тысячелистник"], ["Крапива","Мать-и-мачеха","Обычные водоросли"], ["Тысячелистник","Кости","Имбирь"], ["Шалфей","Хвощ полевой","Росток дерева"], ["Мать-и-мачеха","Липа","Крапива"]],
    "Зелье регенерации": [["Подорожник","Органы монстров","Череда"], ["Календула","Пыльца фей","Кости"], ["Ромашка","Росток дерева","Щупальца"], ["Подорожник","Лаванда","Календула"], ["Череда","Обычные водоросли","Органы монстров"], ["Эхинацея","Череда","Ромашка"], ["Подорожник","Черника","Росток дерева"], ["Органы монстров","Календула","Мать-и-мачеха"], ["Череда","Пыльца фей","Липа"], ["Росток дерева","Подорожник","Эхинацея"]],
    "Сопротивление ядам": [["Одуванчик","Обычные водоросли","Тысячелистник"], ["Череда","Органы монстров","Ромашка"], ["Крапива","Пыльца фей","Календула"], ["Одуванчик","Кости","Рябина"], ["Ромашка","Шалфей","Обычные водоросли"], ["Тысячелистник","Липа","Подорожник"], ["Череда","Мята перечная","Хвощ полевой"], ["Шалфей","Крапива","Эхинацея"], ["Одуванчик","Мать-и-мачеха","Черника"], ["Тысячелистник","Череда","Мелисса"]],
    "Ночное зрение": [["Рябина","Пыльца фей","Лаванда"], ["Крапива","Обычные водоросли","Мята перечная"], ["Черника","Антимагические кристаллы","Ромашка"], ["Рябина","Шалфей","Пыльца фей"], ["Лаванда","Мелисса","Обычные водоросли"], ["Черника","Мята перечная","Паутина"], ["Антимагические кристаллы","Черника","Лаванда"], ["Рябина","Черника","Липа"], ["Мята перечная","Пыльца фей","Черника"], ["Шалфей","Паутина","Черника"]],
    "Зелье скрытности": [["Лаванда","Паутина","Череда"], ["Мелисса","Пыльца фей","Обычные водоросли"], ["Мята перечная","Щупальца","Шалфей"], ["Паутина","Росток дерева","Ромашка"], ["Череда","Лаванда","Одуванчик"], ["Паутина","Мелисса","Мята перечная"], ["Обычные водоросли","Череда","Антимагические кристаллы"], ["Паутина","Шалфей","Липа"], ["Лаванда","Мята перечная","Росток дерева"], ["Мелисса","Паутина","Тысячелистник"]],
    "Усиление чувств": [["Имбирь","Монеты медные","Мята перечная"], ["Ромашка","Пыльца фей","Лаванда"], ["Рябина","Антимагические кристаллы","Шалфей"], ["Мята перечная","Рябина","Обычные водоросли"], ["Лаванда","Череда","Пыльца фей"], ["Имбирь","Антимагические кристаллы","Ромашка"], ["Пыльца фей","Черника","Имбирь"], ["Шалфей","Мята перечная","Монеты медные"], ["Росток дерева","Лаванда","Имбирь"], ["Антимагические кристаллы","Череда","Рябина"]],
    "Целебный чай": [["Мелисса", "Мята перечная", "Ромашка"], ["Черника", "Рябина", "Липа"], ["Имбирь", "Боярышник", "Липа"], ["Тысячелистник", "Календула", "Шалфей"], ["Черника", "Мята перечная", "Росток дерева"], ["Календула", "Липа", "Ромашка"], ["Имбирь", "Мята перечная", "Черника"]],
    "Болотный пар": [["Обычные водоросли","Паутина","Мелисса"], ["Обычные водоросли","Череда","Ромашка"]],
    "Звенящая банка": [["Монеты медные","Крапива","Пыльца фей"], ["Монеты медные","Мята перечная","Шалфей"]],
    "Липкая неудача": [["Паутина","Одуванчик","Календула"]],
    "Странный шепот": [["Пыльца фей","Шалфей","Обычные водоросли"]],
    "Тяжелый взгляд": [["Кости","Лаванда","Росток дерева"]],
    "Бесполезная сила": [["Имбирь","Монеты медные","Череда"]],
    "Мокрое сожаление": [["Обычные водоросли","Ромашка","Паутина"]],
    "Пустой свет": [["Пыльца фей","Антимагические кристаллы","Лаванда"]],
    "Медленная мысль": [["Мелисса","Шалфей","Ромашка"]],
    "Вечная пустота": [["Росток дерева","Кости","Обычные водоросли"]],
    "Тухлое дыхание": [["Обычные водоросли","Кости","Мята перечная"]],
    "Спутанные волосы": [["Паутина","Лаванда","Росток дерева"]],
    "Магический сбой": [["Пыльца фей","Антимагические кристаллы","Ромашка"]],
    "Дрожь силы": [["Щупальца","Крапива","Эхинацея"]],
    "Взрывная неудача": [["Монеты медные","Кости","Имбирь"]],
    "Кожный зуд": [["Череда","Одуванчик","Обычные водоросли"]],
    "Глухой шепот": [["Шалфей","Мелисса","Пыльца фей"]]
};

const recipeMap = {};
for (const [name, combos] of Object.entries(recipesRaw)) {
    combos.forEach(combo => { recipeMap[key(combo)] = name; });
}

let discovered = JSON.parse(localStorage.getItem('alch_classic_v2') || '{}');
let current = null;

function update(){
    let vals = [s1.value, s2.value, s3.value];
    if(vals.includes("") || new Set(vals).size !== 3) { 
        result.textContent = "Выберите реагенты"; 
        result.style.color = "#e8eaed"; // Обычный цвет
        current = null; return; 
    }

    let k = key(vals);
    if(recipeMap[k]){
        current = { potion: recipeMap[k], combo: vals.join(" + ") };
        result.style.color = "#8ab4f8"; // Цвет для зелий
    } 
    else if (vals.every(v => teaHerbs.includes(v)) && vals.some(v => teaBasics.includes(v))) {
        current = { potion: "Обычный травяной чай", combo: vals.join(" + ") };
        result.style.color = "#81c995"; // Цвет для чая
    } 
    else {
        result.style.color = "#e8eaed"; // Обычный цвет для неудачи
        current = null;
    }
    result.textContent = current ? current.potion : "Алхимическая неудача";
}

[s1,s2,s3].forEach(s => s.onchange = update);

function save(){
    if(!current) return;
    if(!discovered[current.potion]) discovered[current.potion] = [];
    if(!discovered[current.potion].includes(current.combo)) {
        discovered[current.potion].push(current.combo);
    }
    localStorage.setItem('alch_classic_v2', JSON.stringify(discovered));
    render();
}

function clearAll(){
    if(confirm("Сбросить прогресс?")) {
        discovered = {};
        localStorage.removeItem('alch_classic_v2');
        render();
    }
}

function render(){
    let keys = Object.keys(discovered).sort();
    list.innerHTML = keys.length 
        ? keys.map(p => `<b>${p}</b><span>${discovered[p].join("<br>")}</span>`).join("") 
        : "Пока здесь пусто";
}

render();
</script>
</body>
</html>

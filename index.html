<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Состояние тела</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#181b20;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ОСНОВА */

.main{
    width:100%;
    min-height:100vh;

    background:#1f2329;

    border-top:2px solid #30353d;

    position:relative;

    overflow:hidden;
}

/* ЗАГОЛОВОК */

.title{
    text-align:center;

    font-size:34px;
    font-weight:bold;

    letter-spacing:3px;

    padding-top:20px;
}

/* ЧЕЛОВЕК */

.human-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    overflow:hidden;
}

.human{

    position:relative;

    width:320px;
    height:980px;

    margin-top:10px;

    transform-origin:top center;
}

/* ОБЩИЙ СТИЛЬ */

.part{
    position:absolute;

    background:#4fae63;

    border:2px solid #1b1b1b;

    cursor:pointer;

    transition:0.2s;
}

.part:active{
    transform:scale(0.97);
}

/* ГОЛОВА */

.head{
    width:95px;
    height:115px;

    left:112px;
    top:0;

    border-radius:48%;
}

/* ШЕЯ */

.neck{
    width:42px;
    height:34px;

    left:139px;
    top:100px;

    border-radius:15px;
}

/* ГРУДЬ */

.chest{
    width:160px;
    height:165px;

    left:80px;
    top:128px;

    border-radius:38px;
}

/* ЖИВОТ */

.stomach{
    width:128px;
    height:150px;

    left:96px;
    top:282px;

    border-radius:30px;
}

/* РУКИ */

.bicep-left,
.bicep-right{
    width:50px;
    height:142px;

    border-radius:28px;
}

.bicep-left{
    left:42px;
    top:150px;
}

.bicep-right{
    right:42px;
    top:150px;
}

/* ПРЕДПЛЕЧЬЯ */

.forearm-left,
.forearm-right{
    width:44px;
    height:132px;

    border-radius:28px;
}

.forearm-left{
    left:47px;
    top:282px;
}

.forearm-right{
    right:47px;
    top:282px;
}

/* КИСТИ */

.hand-left,
.hand-right{
    width:38px;
    height:52px;

    border-radius:18px;
}

.hand-left{
    left:50px;
    top:406px;
}

.hand-right{
    right:50px;
    top:406px;
}

/* ЛЯЖКИ */

.thigh-left,
.thigh-right{
    width:60px;
    height:182px;

    border-radius:30px;
}

.thigh-left{
    left:98px;
    top:442px;
}

.thigh-right{
    right:98px;
    top:442px;
}

/* ИКРЫ */

.calf-left,
.calf-right{
    width:48px;
    height:172px;

    border-radius:26px;
}

.calf-left{
    left:104px;
    top:620px;
}

.calf-right{
    right:104px;
    top:620px;
}

/* СТОПЫ */

.foot-left,
.foot-right{
    width:66px;
    height:28px;

    border-radius:15px;
}

.foot-left{
    left:82px;
    top:790px;
}

.foot-right{
    right:82px;
    top:790px;
}

/* POPUP */

.popup{

    position:fixed;

    left:50%;
    bottom:-400px;

    transform:translateX(-50%);

    width:92%;
    max-width:360px;

    background:#272c34;

    border:2px solid #3c424c;
    border-radius:20px 20px 0 0;

    padding:18px;

    z-index:999;

    transition:0.3s;
}

.popup.active{
    bottom:0;
}

.popup-title{
    text-align:center;

    font-size:20px;
    font-weight:bold;

    margin-bottom:14px;
}

/* SELECT */

.popup select{

    width:100%;

    padding:14px;

    background:#1b1e24;

    border:none;
    border-radius:12px;

    color:white;

    font-size:17px;
}

/* СТАТУС */

.status{
    margin-top:14px;

    text-align:center;

    font-size:18px;
    font-weight:bold;
}

/* КНОПКА ЗАКРЫТЬ */

.close-btn{

    width:100%;

    margin-top:14px;

    padding:12px;

    border:none;
    border-radius:12px;

    background:#3a404a;

    color:white;

    font-size:16px;

    cursor:pointer;
}

/* ===== ТЕЛЕФОН ===== */

@media(max-width:700px){

.title{
    font-size:26px;
    padding-top:16px;
}

.human{
    transform:scale(0.82);
    margin-top:-40px;
}

}

/* ===== МАЛЕНЬКИЕ ТЕЛЕФОНЫ ===== */

@media(max-width:450px){

.title{
    font-size:22px;
}

.human{
    transform:scale(0.68);
    margin-top:-120px;
}

.main{
    min-height:900px;
}

.popup{
    width:100%;
    max-width:none;
    border-radius:22px 22px 0 0;
}

}

/* ===== ОЧЕНЬ МАЛЕНЬКИЕ ===== */

@media(max-width:360px){

.human{
    transform:scale(0.58);
    margin-top:-180px;
}

.title{
    font-size:19px;
}

}

</style>
</head>

<body>

<div class="main">

<div class="title">
СОСТОЯНИЕ ТЕЛА
</div>

<div class="human-wrapper">

<div class="human">

<div class="part head" id="head"></div>

<div class="part neck" id="neck"></div>

<div class="part chest" id="chest"></div>

<div class="part stomach" id="stomach"></div>

<div class="part bicep-left" id="bicep-left"></div>

<div class="part forearm-left" id="forearm-left"></div>

<div class="part hand-left" id="hand-left"></div>

<div class="part bicep-right" id="bicep-right"></div>

<div class="part forearm-right" id="forearm-right"></div>

<div class="part hand-right" id="hand-right"></div>

<div class="part thigh-left" id="thigh-left"></div>

<div class="part calf-left" id="calf-left"></div>

<div class="part foot-left" id="foot-left"></div>

<div class="part thigh-right" id="thigh-right"></div>

<div class="part calf-right" id="calf-right"></div>

<div class="part foot-right" id="foot-right"></div>

</div>

</div>

</div>

<script>

/* ЧАСТИ ТЕЛА */

const bodyParts=[

["head","Голова"],
["neck","Шея"],

["chest","Грудь"],
["stomach","Живот"],

["bicep-left","Л. Бицепс"],
["forearm-left","Л. Предплечье"],
["hand-left","Л. Кисть"],

["bicep-right","П. Бицепс"],
["forearm-right","П. Предплечье"],
["hand-right","П. Кисть"],

["thigh-left","Л. Ляжка"],
["calf-left","Л. Икра"],
["foot-left","Л. Стопа"],

["thigh-right","П. Ляжка"],
["calf-right","П. Икра"],
["foot-right","П. Стопа"]

];

/* СОЗДАНИЕ POPUP */

bodyParts.forEach(part=>{

const popup=document.createElement("div");

popup.className="popup";

popup.id="popup-"+part[0];

popup.innerHTML=`

<div class="popup-title">
${part[1]}
</div>

<select onchange="updatePart('${part[0]}',this.value)">

<option value="100">100%</option>
<option value="80">80%</option>
<option value="60">60%</option>
<option value="40">40%</option>
<option value="20">20%</option>
<option value="0">0%</option>

</select>

<div class="status" id="status-${part[0]}">
Нормально
</div>

<button class="close-btn"
onclick="closePopup('${popup.id}')">

Закрыть

</button>

`;

document.body.appendChild(popup);

});

/* ОТКРЫТИЕ */

bodyParts.forEach(part=>{

document.getElementById(part[0])
.addEventListener("click",()=>{

document.querySelectorAll(".popup")
.forEach(p=>p.classList.remove("active"));

document
.getElementById("popup-"+part[0])
.classList.add("active");

});

});

/* ЗАКРЫТИЕ */

function closePopup(id){

document.getElementById(id)
.classList.remove("active");

}

/* СОСТОЯНИЯ */

function updatePart(id,value){

value=parseInt(value);

const part=document.getElementById(id);

const status=document
.getElementById("status-"+id);

let color="#4fae63";
let text="Нормально";

if(value>=80 && value<100){

color="#7ea95c";
text="Синяк";

}

if(value>=60 && value<80){

color="#b5ab56";
text="Рана";

}

if(value>=40 && value<60){

color="#bf7b52";
text="Тяжело";

}

if(value>=20 && value<40){

color="#b85b5b";
text="Критично";

}

if(value===0){

color="#434343";
text="Выведено";

}

part.style.background=color;

status.innerText=text;

}

</script>

</body>
</html>

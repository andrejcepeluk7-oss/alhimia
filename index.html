<html lang="ru">
<head>

<title>Алхимия реагентов</title>

<style>
body {
    font-family: "Comic Sans MS", cursive;
    background: #202124;
    color: #e8eaed;
    margin: 0;
    padding: 12px;
}

.container {
    max-width: 500px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

select {
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: #303134;
    color: white;
    font-size: 18px;
}

.result {
    padding: 16px;
    border-radius: 14px;
    background: #2d2f33;
    min-height: 50px;
    font-size: 20px;
    text-align: center;
}

.discovered {
    padding: 12px;
    border-radius: 14px;
    background: #2d2f33;
}

.btn-row {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    background: #3a3d42;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #4a4d52;
}
</style>
</head>

<body>

<div class="container">
    <select id="s1"></select>
    <select id="s2"></select>
    <select id="s3"></select>

    <div class="result" id="result">Выбери 3 реагента</div>

    <div class="btn-row">

    "Пыльца фей","Антимагические кристаллы","Щупальца","Монеты медные","Паутина"

reagents = [...new Set(reagents)].sort((a,b)=>a.localeCompare(b,'ru'));

// UI SELECTS
// ======================
function fill(sel){
    sel.innerHTML = `<option value="">Выбери реагент</option>`;
    reagents.forEach(r=>{
        let o = document.createElement('option');
        o.value = r;
        o.textContent = r;
        sel.appendChild(o);
    });
}

fill(s1); fill(s2); fill(s3);

function key(arr){
    return [...arr].sort((a,b)=>a.localeCompare(b,'ru')).join('|');
}

    [key(["Череда","Органы монстров","Ромашка"])]: "Зелье сопротивления ядам",
    [key(["Крапива","Пыльца фей","Календула"])]: "Зелье сопротивления ядам",
    [key(["Одуванчик","Кости","Рябина"])]: "Зелье сопротивления ядам",

    [key(["Монеты медные","Ромашка","Одуванчик"])]: "Зелье звенящей банки",

    [key(["Паутина","Одуванчик","Календула"])]: "Зелье липкой неудачи",
    [key(["Паутина","Рябина","Мелисса"])]: "Зелье липкой неудачи",
    [key(["Паутина","Тысячелистник","Череда"])]: "Зелье липкой неудачи",

    [key(["Пыльца фей","Шалфей","Обычные водоросли"])]: "Зелье странного шёпота",
    [key(["Пыльца фей","Лаванда","Мята перечная"])]: "Зелье странного шёпота",
    [key(["Пыльца фей","Ромашка","Кости"])]: "Зелье странного шёпота",

    [key(["Кости","Лаванда","Росток дерева"])]: "Зелье тяжёлого взгляда",
    [key(["Кости","Рябина","Одуванчик"])]: "Зелье тяжёлого взгляда",
    [key(["Кости","Шалфей","Мелисса"])]: "Зелье тяжёлого взгляда",

    [key(["Имбирь","Монеты медные","Череда"])]: "Зелье бесполезной силы",
    [key(["Имбирь","Паутина","Ромашка"])]: "Зелье бесполезной силы",
    [key(["Имбирь","Обычные водоросли","Мята перечная"])]: "Зелье бесполезной силы",

    [key(["Обычные водоросли","Ромашка","Паутина"])]: "Зелье мокрого сожаления",
    [key(["Обычные водоросли","Мелисса","Крапива"])]: "Зелье мокрого сожаления",
    [key(["Обычные водоросли","Липа","Череда"])]: "Зелье мокрого сожаления",

    [key(["Пыльца фей","Мята перечная","Череда"])]: "Зелье пустого света",

    [key(["Мелисса","Шалфей","Ромашка"])]: "Зелье медленной мысли",
    [key(["Мелисса","Лаванда","Обычные водоросли"])]: "Зелье медленной мысли",

    [key(["Паутина","Лаванда","Росток дерева"])]: "Зелье спутанных волос",

};

// ======================
// GAME LOGIC
// ======================
let discovered = JSON.parse(localStorage.getItem('alch') || '{}');
let current = null;

function update(){
    let vals = [s1.value, s2.value, s3.value];
    if(vals.includes("")){
        result.textContent = "Выбери 3 реагента";
        current = null;
        return;
    }

    let k = key(vals);

    if(recipes[k]){
        current = { potion: recipes[k], combo: vals.join(" + ") };
        result.textContent = current.potion;
    } else {
        result.textContent = "Провал ☠️";
        current = null;
    }
}

[s1,s2,s3].forEach(s => s.onchange = update);

function save(){
    if(!current) return;
    if(!discovered[current.potion]) discovered[current.potion] = [];
    if(!discovered[current.potion].includes(current.combo)){
        discovered[current.potion].push(current.combo);
    }
    localStorage.setItem('alch', JSON.stringify(discovered));
    render();
}

function clearAll(){
    if(confirm("Очистить все открытые рецепты?")) {
        discovered = {};
        localStorage.removeItem('alch');
        render();
    }
}

function render(){
    let out = Object.keys(discovered);
    list.innerHTML = out.length
        ? out.map(p => `<b>${p}</b><br>${discovered[p].join("<br>")}<br><br>`).join("")
        : "Пусто";
}

render();
</script>

</body>
